author: "TheUnknownOne"
delete-after: True
changes:
  - rscadd: "Добавлены две новые расы: скреллы и воксы."
  - rscadd: "Скреллы - вегетарианцы и имеют высокое сопротивление теплу, но сильную уязвимость к холоду, а также могут передавать сородичам послания через Ноосферу."
  - rscadd: "Воксы могут дышать только чистым азотом: кислород токсичен для них. Однако, их сложнее ранить, нежели обычных людей."